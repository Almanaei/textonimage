name: CI

on: [push, pull_request]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      STATS_SECRET: ci-stats-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin-analytics-integration:
    runs-on: ubuntu-latest
    needs: static-checks
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arabic_image_gen
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arabic_image_gen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arabic_image_gen
      STATS_SECRET: ci-stats-secret-0123456789abcdef0123456789abcdef
      PGSSLMODE: disable
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run start &
      - name: Wait for app to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not start within timeout"
          exit 1
      - run: npm run qa:analytics
